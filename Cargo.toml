[workspace]
members = ["apps/desktop", "crates/protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
ed25519-dalek = "3.0.0"
directories = "6.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
slint = "1.18.1"
slint-build = "1.18.1"
futures-util = "0.3.31"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
zeroize = "1.8.2"
