[workspace]
members = ["apps/desktop", "crates/protocol"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
async-trait = "0.1.89"
ed25519-dalek = "3.0.0"
directories = "6.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
futures-util = "0.3.31"
serde_json = "1.0.145"
tauri = "=2.12.5"
tauri-build = "=2.7.4"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "net", "macros", "sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
webrtc = "=0.21.1"
zeroize = "1.8.2"
